<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ODM site moved</title>
  <meta http-equiv="refresh" content="0; url=https://hembrow-innovations.github.io/odm-web/">
  <link rel="canonical" href="https://hembrow-innovations.github.io/odm-web/">
  <script>
    (function () {
      var dest = "https://hembrow-innovations.github.io/odm-web";
      var path = location.pathname.replace(/^\/odm\/?/, "/") || "/";
      if (path === "/index.html") path = "/";
      location.replace(dest + (path === "/" ? "/" : path) + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>The ODM site moved to <a href="https://hembrow-innovations.github.io/odm-web/">hembrow-innovations.github.io/odm-web</a>.</p>
</body>
</html>
